# Performance test: batch_size=512, steps=100
# Expected: ~150 seconds per epoch (512 * 100 * 3ms = 153.6s)

batch_size: 512
num_epochs: 3

training:
  batch_size: 512
  num_batches_per_epoch: 100
  num_epochs: 3
  num_instances: 153600  # 3 * 100 * 512
  learning_rate: 0.0001
  validation_frequency: 1

problem:
  coord_range: 100
  demand_range: [1, 10]
  num_customers: 10
  vehicle_capacity: 30

baseline:
  eval_batches: 1
  type: rollout
  update:
    enabled: true
    frequency: 1

data_generation:
  enable_prefetch: true
  num_workers: 8
  prefetch_queue_size: 3

gpu:
  device: cuda:0
  enabled: true
  mixed_precision: true
  gradient_accumulation_steps: 1
  memory_fraction: 0.95
  non_blocking: true
  pin_memory: true

model:
  hidden_dim: 128
  num_heads: 4
  num_layers: 3
  transformer_dropout: 0.1

training_advanced:
  scheduler_type: cosine
  temp_start: 2.5
  temp_min: 0.7
  use_lr_scheduling: true
  gradient_clip_norm: 1.0
  weight_decay: 0.0001

experiment:
  random_seed: 42
  strict_validation: true

num_customers: 10
capacity: 30
coord_range: 100
demand_range: [1, 10]
