# Default configuration loaded first and deep-merged with any provided config
# Put all stable/tuning parameters here. Per-experiment configs override only what they study.

# Working directory (will usually be overridden by scale-specific config)

# =============================
# Core CVRP problem parameters
# =============================
problem:
  num_customers: 20            # Number of customer locations
  vehicle_capacity: 30         # Vehicle capacity constraint
  demand_range: [1, 10]        # Customer demand range
  coord_range: 100             # Coordinate space range

# =============================
# Training parameters
# =============================
training:
  num_steps: 1500              # Batches per training epoch
  batch_size: 512              # Training batch size
  num_epochs: 100              # Total training epochs
  learning_rate: 1e-4          # Base learning rate
  validation_frequency: 2      # Run validation every N epochs
  use_geometric_mean: false    # Use geometric mean for cost aggregation

# =============================
# Model architecture
# =============================
model:
  input_dim: 3                 # Node feature dimension
  hidden_dim: 256              # Hidden dimension for transformers
  num_heads: 4                 # Number of attention heads
  num_layers: 4                # Number of transformer layers
  transformer_dropout: 0.1     # Dropout probability for regularization
  feedforward_multiplier: 2    # FFN width = hidden_dim × multiplier
# =============================

# =============================
# Advanced training parameters
# =============================
training_advanced:
  # Temperature controls action sampling diversity
  use_adaptive_temperature: true  # false = cosine schedule, true = adaptive
  temp_start: 2.5              # Initial temperature
  temp_min: 0.15               # Final temperature
  temp_adaptation_rate: 0.18   # Temperature decay rate
  
  # Entropy encourages exploration (cosine decay from coef to min)
  entropy_coef: 0.03           # Starting entropy coefficient (decays to entropy_min)
  entropy_min: 0.002           # Minimum entropy

  # Optimizer settings
  weight_decay: 0.0001         # L2 regularization
  gradient_clip_norm: 2.0      # Gradient clipping
  adam_beta1: 0.9              # First moment decay
  adam_beta2: 0.999            # Second moment decay
  adam_eps: 1.0e-8             # Numerical stability
  
  # Learning rate scheduling  
  use_lr_scheduling: true
  scheduler_type: "cosine"     # Options: cosine, plateau
  min_lr: 0.000001             # Minimum learning rate
  
  # Early stopping
  use_early_stopping: false
  early_stopping_patience: 10
  early_stopping_delta: 0.0001

  # PyTorch compilation (torch.compile)
  compile:
    mode: "default"            # Options: "default", "reduce-overhead", "max-autotune"

# =============================

# =============================
# Rollout baseline
# =============================
baseline:
  type: "rollout"
  eval_batches: 5              # Evaluation dataset size
  update:
    enabled: true
    frequency: 1               # Check every N epochs
    significance_test: true  
    p_value: 0.10              # P-value threshold for update
    warmup_epochs: 0           # Skip baseline updates during warmup


# =============================
# Inference and evaluation
# =============================
inference:
  default_temperature: 1.0
  max_steps_multiplier: 2

# =============================
# GPU Configuration
# =============================
gpu:
  enabled: true                # Enable GPU training if available
  device: "cuda:0"             # GPU device to use (cuda:0, cuda:1, etc.)
  mixed_precision: true        # Enable automatic mixed precision (FP16)
  memory_fraction: 0.95        # Fraction of GPU memory to use
  pin_memory: true             # Pin memory for faster CPU-GPU transfer
  non_blocking: true           # Non-blocking tensor transfers
  gradient_accumulation_steps: 1  # Gradient accumulation for larger effective batch size
  num_workers: 4               # Data loading workers
  prefetch_factor: 2           # Batches to prefetch

# =============================
# Logging
# =============================
logging:
  level: "INFO"
  format: "%(message)s"
